# Opt-in overlay for a HUMAN sandbox demonstration AFTER the isolated suite.
# Never use with compose.yaml or development PostgreSQL.
services:
  backend-app:
    environment:
      # The isolated suite already seeded the catalog. Never run its one-shot
      # demo loader again when recreating this backend to enable Stripe.
      SPRING_PROFILES_ACTIVE: isolated
      HOTEL_CHECKOUT_ENABLED: 'true'
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:?Configure una clave publicable sandbox privada}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Configure una clave secreta sandbox privada}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Configure el secreto privado del listener}
    networks: [isolated, stripe-egress]

networks:
  stripe-egress: {}
